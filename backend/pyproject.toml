[project]
name = "volunteer-copilot-backend"
version = "0.1.0"
description = "Backend API for volunteer-copilot"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28",
    # Capped: app/services/keenable.py relies on SDK internals.
    "keenable>=0.1.3,<0.2",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.6",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

# Lint and format new revisions so they pass `ruff check` and `ruff format --check`.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
